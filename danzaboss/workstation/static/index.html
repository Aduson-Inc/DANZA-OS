<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DANZA-OS — product dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpolygon points='24,4 30,16 19,38 10,38' fill='%23c8102e'/%3E%3Cpolygon points='27,18 38,38 30,38 23,26' fill='%23c8102e'/%3E%3Cpolygon points='33,6 44,26 37,26 29,12' fill='%23e8354f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/app.css">
</head>
<body>

<!-- TOP BAR — one journey, no tabs. Advanced controls live behind the one
     "Advanced" menu; CORTEX stays a plain link out to its own UI. -->
<header class="topbar">
  <div class="brand">
    <div class="mark" id="mark" title="DANZA-OS">
      <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true">
        <polygon points="24,4 30,16 19,38 10,38" fill="var(--crimson)"/>
        <polygon points="27,18 38,38 30,38 23,26" fill="var(--crimson)"/>
        <polygon points="33,6 44,26 37,26 29,12" fill="var(--ember)"/>
      </svg>
    </div>
    <h1 class="wordmark">DANZA-OS</h1>
    <div class="live" id="live-dot" title="live — updates as state changes">
      <span class="live-tri"></span><span class="live-label">live</span>
    </div>
  </div>

  <div class="topbar-right">
    <a class="chip" href="cortex/">CORTEX</a>
    <button class="chip" id="advanced-toggle" aria-expanded="false"
      aria-controls="advanced-drawer">Advanced</button>
  </div>
</header>

<main class="stage">
  <div class="column">
    <!-- FLOW RAIL — where you are in Connect → Describe → Approve → Build → Done. -->
    <nav class="flow-rail" id="flow-rail" aria-label="Build journey"></nav>

    <!-- TEAM — the one merged list of who's on the team, live, and whose
         turn it is (single source of truth: /api/flow). -->
    <div class="team-strip" id="team-strip"></div>

    <!-- STAGES — completed stages collapse to a summary row, the current
         stage stays open, future stages stay locked. -->
    <div id="stages"></div>
  </div>
</main>

<!-- ADVANCED — everything rarely used lives in one drawer: CORTEX memory
     stats, the raw activity log, and internal build-plan artifacts. -->
<aside class="drawer" id="advanced-drawer" hidden aria-label="Advanced">
  <button class="drawer-close" id="advanced-close" aria-label="Close">×</button>
  <h2>Advanced</h2>
  <div id="advanced-body"></div>
</aside>

<script src="static/app.js"></script>
</body>
</html>
